version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fn_mercadinho
      POSTGRES_USER: fn_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fn_user"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  evolution-api:
    image: atendai/evolution-api:latest
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-evo_key_change_me}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://fn_user:${DB_PASSWORD:-changeme}@postgres:5432/fn_mercadinho
      - DATABASE_ENABLED=true
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - REDIS_PREFIX=evolution
      - SERVER_URL=http://3.19.75.246:8080
      - CORS_ORIGIN=*
      - SSL=false
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://fn_user:${DB_PASSWORD:-changeme}@postgres:5432/fn_mercadinho
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://172.17.0.1:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-evo_key_change_me}
      - ANTHROPIC_API_KEY=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
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      - ENV=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pg_data:
  redis_data:
