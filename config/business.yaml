# Catálogo resumido para o bot (categorias principais).
# O catálogo completo com todos os produtos está em config/catalog_full.yaml
# e é carregado no banco de dados via: make seed
catalogo:
  - categoria: "Bebidas"
    descricao: "Refrigerantes, sucos, água, energéticos, cerveja e outras bebidas"
  - categoria: "Biscoitos"
    descricao: "Biscoitos doces, salgados e recheados"
  - categoria: "Bomboniere"
    descricao: "Chocolates, balas, chicletes e doces"
  - categoria: "Cereais e Matinais"
    descricao: "Farinhas, cereais, granola, aveia e café da manhã"
  - categoria: "Conservas"
    descricao: "Conservas, molhos e temperos"
  - categoria: "Congelados"
    descricao: "Frangos, carnes congeladas e produtos congelados em geral"
  - categoria: "Cuidados Pessoais"
    descricao: "Higiene pessoal, cosméticos e medicamentos básicos"
  - categoria: "Frios e Laticínios"
    descricao: "Queijos, frios, presunto, iogurte e laticínios"
  - categoria: "FLV / Horti"
    descricao: "Frutas, legumes, verduras e hortaliças frescas"
  - categoria: "Limpeza"
    descricao: "Produtos de limpeza doméstica"
  - categoria: "Açougue"
    descricao: "Carnes bovinas, suínas e aves"
  - categoria: "Utilidades Domésticas"
    descricao: "Utensílios, pilhas, isqueiros e itens para o lar"
  - categoria: "Geral"
    descricao: "Outros produtos variados"

